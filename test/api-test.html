<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DARE API Test</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0f1117; color: #e1e4e8; padding: 2rem; }
    h1 { font-size: 1.4rem; margin-bottom: 0.5rem; }
    .subtitle { color: #8b949e; margin-bottom: 1.5rem; font-size: 0.9rem; }
    .config { display: flex; gap: 0.5rem; align-items: center; margin-bottom: 2rem; }
    .config label { font-size: 0.85rem; color: #8b949e; }
    .config input { background: #161b22; border: 1px solid #30363d; color: #e1e4e8; padding: 0.4rem 0.6rem; border-radius: 6px; font-family: monospace; font-size: 0.85rem; width: 280px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 1rem; }
    .card { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 1.2rem; }
    .card h2 { font-size: 0.95rem; margin-bottom: 0.3rem; }
    .card .method { font-size: 0.75rem; font-family: monospace; padding: 0.15rem 0.4rem; border-radius: 4px; font-weight: 600; margin-right: 0.4rem; }
    .get { background: #1f3a2e; color: #3fb950; }
    .post { background: #3a2e1f; color: #d29922; }
    .card .path { font-family: monospace; font-size: 0.85rem; color: #8b949e; }
    .card .desc { font-size: 0.8rem; color: #8b949e; margin: 0.6rem 0; }
    .card button { background: #238636; color: #fff; border: none; padding: 0.5rem 1rem; border-radius: 6px; cursor: pointer; font-size: 0.85rem; font-weight: 500; }
    .card button:hover { background: #2ea043; }
    .card button:active { transform: scale(0.98); }
    .result { margin-top: 0.8rem; background: #0d1117; border: 1px solid #30363d; border-radius: 6px; padding: 0.8rem; font-family: monospace; font-size: 0.8rem; white-space: pre-wrap; word-break: break-word; display: none; max-height: 240px; overflow-y: auto; }
    .result.visible { display: block; }
    .result .status { font-weight: 600; margin-bottom: 0.4rem; }
    .status-ok { color: #3fb950; }
    .status-err { color: #f85149; }
  </style>
</head>
<body>

<h1>DARE API Test</h1>
<p class="subtitle">Manuelle Tests gegen die laufende DARE-Instanz</p>

<div class="config">
  <label for="base-url">Base URL:</label>
  <input id="base-url" type="text" value="http://localhost:3000">
</div>

<div class="grid">

  <div class="card">
    <h2><span class="method get">GET</span><span class="path">/health</span></h2>
    <p class="desc">Systemstatus abfragen</p>
    <button onclick="send(this, 'GET', '/health')">Send</button>
    <div class="result"></div>
  </div>

  <div class="card">
    <h2><span class="method post">POST</span><span class="path">/webhooks</span></h2>
    <p class="desc">Event: <strong>framework.activated</strong> — Framework-Setup anlegen</p>
    <button onclick="send(this, 'POST', '/webhooks', {
      'x-event-type': 'framework.activated'
    }, {
      installation: { id: 'inst-1' },
      repository: { owner: 'acme', name: 'my-repo' }
    })">Send</button>
    <div class="result"></div>
  </div>

  <div class="card">
    <h2><span class="method post">POST</span><span class="path">/webhooks</span></h2>
    <p class="desc">Event: <strong>workitem.opened</strong> — Reminder pinnen</p>
    <button onclick="send(this, 'POST', '/webhooks', {
      'x-event-type': 'workitem.opened'
    }, {
      installation: { id: 'inst-1' },
      repository: { owner: 'acme', name: 'my-repo' },
      workItem: { id: 'WI-42' }
    })">Send</button>
    <div class="result"></div>
  </div>

  <div class="card">
    <h2><span class="method post">POST</span><span class="path">/webhooks</span></h2>
    <p class="desc">Event: <strong>unknown.event</strong> — Unbekanntes Event</p>
    <button onclick="send(this, 'POST', '/webhooks', {
      'x-event-type': 'unknown.event'
    }, {
      some: 'payload'
    })">Send</button>
    <div class="result"></div>
  </div>

</div>

<script>
  function getBaseUrl() {
    return document.getElementById('base-url').value.replace(/\/+$/, '');
  }

  async function send(btn, method, path, headers = {}, body = null) {
    const resultDiv = btn.parentElement.querySelector('.result');
    resultDiv.classList.add('visible');
    resultDiv.innerHTML = '<span style="color:#8b949e">Sending...</span>';

    const url = getBaseUrl() + path;
    const options = { method };

    if (body) {
      options.headers = { 'Content-Type': 'application/json', ...headers };
      options.body = JSON.stringify(body);
    } else {
      options.headers = headers;
    }

    try {
      const res = await fetch(url, options);
      const text = await res.text();
      let formatted;
      try {
        formatted = JSON.stringify(JSON.parse(text), null, 2);
      } catch {
        formatted = text;
      }
      const ok = res.status >= 200 && res.status < 400;
      resultDiv.innerHTML =
        `<div class="status ${ok ? 'status-ok' : 'status-err'}">${res.status} ${res.statusText}</div>` +
        formatted;
    } catch (err) {
      resultDiv.innerHTML = `<div class="status status-err">Error</div>${err.message}`;
    }
  }
</script>

</body>
</html>
