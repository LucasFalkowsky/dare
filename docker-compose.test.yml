services:
  postgres-test:
    image: postgres:17
    environment:
      POSTGRES_USER: dare
      POSTGRES_PASSWORD: dare
      POSTGRES_DB: dare_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dare -d dare_test"]
      interval: 5s
      timeout: 3s
      retries: 5
